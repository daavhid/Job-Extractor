<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LinkedIn Job Extractor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 400px;
      min-height: 200px;
      background: #0a0a0f;
      color: #e8e6f0;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e1e2e;
      background: linear-gradient(135deg, #0d0d1a 0%, #0a0a0f 100%);
    }
    .logo {
      width: 28px; height: 28px;
      background: #0077b5;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; color: #fff; letter-spacing: -1px;
      flex-shrink: 0;
    }
    .header-text h1 { font-size: 14px; font-weight: 600; color: #f0eeff; }
    .header-text p  { font-size: 11px; color: #6b6980; margin-top: 1px; }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #1e1e2e;
    }
    button {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    #extractBtn {
      background: #0077b5;
      color: #fff;
    }
    #extractBtn:hover { background: #005f92; }
    #copyBtn {
      background: #1e1e2e;
      color: #a8a5c0;
      border: 1px solid #2e2e42;
    }
    #copyBtn:hover { background: #252538; color: #e0ddf5; }
    #exportBtn {
      background: #1a2a1a;
      color: #5dbf5d;
      border: 1px solid #2a3f2a;
    }
    #exportBtn:hover { background: #1e301e; }

    /* ── Status ── */
    .status {
      padding: 6px 16px;
      font-size: 11px;
      color: #6b6980;
      min-height: 24px;
    }
    .status.success { color: #5dbf5d; }
    .status.error   { color: #e05c5c; }
    .status.info    { color: #7b9fe8; }

    /* ── Results ── */
    #results {
      max-height: 420px;
      overflow-y: auto;
      padding: 0 16px 16px;
    }
    #results::-webkit-scrollbar { width: 4px; }
    #results::-webkit-scrollbar-track { background: transparent; }
    #results::-webkit-scrollbar-thumb { background: #2e2e42; border-radius: 4px; }

    .job-card {
      background: #111120;
      border: 1px solid #1e1e2e;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      position: relative;
    }
    .job-card:hover { border-color: #2e2e48; }

    .job-number {
      position: absolute;
      top: 10px; right: 10px;
      font-size: 10px;
      color: #3a3a55;
      font-weight: 700;
    }

    .job-title {
      font-size: 13px;
      font-weight: 700;
      color: #c5c2e8;
      margin-bottom: 3px;
      padding-right: 24px;
      line-height: 1.4;
    }
    .job-company {
      font-size: 12px;
      color: #0077b5;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .job-link a {
      font-size: 11px;
      color: #4a6fa8;
      text-decoration: none;
      word-break: break-all;
    }
    .job-link a:hover { color: #7b9fe8; text-decoration: underline; }

    .desc-toggle {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      color: #5a5875;
      cursor: pointer;
      user-select: none;
    }
    .desc-toggle:hover { color: #a8a5c0; }

    .job-description {
      margin-top: 8px;
      font-size: 11px;
      color: #7a7890;
      line-height: 1.6;
      max-height: 120px;
      overflow-y: auto;
      background: #0d0d1a;
      border-radius: 4px;
      padding: 8px;
      display: none;
    }
    .job-description.open { display: block; }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 32px 16px;
      color: #3a3a55;
    }
    .empty .icon { font-size: 32px; margin-bottom: 8px; }
    .empty p { font-size: 12px; line-height: 1.6; }

    /* ── Not LinkedIn ── */
    .not-linkedin {
      padding: 24px 16px;
      text-align: center;
      color: #5a5875;
    }
    .not-linkedin .icon { font-size: 28px; margin-bottom: 8px; }
    .not-linkedin p { font-size: 12px; line-height: 1.6; }
    .not-linkedin a {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 14px;
      background: #0077b5;
      color: #fff;
      border-radius: 5px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">in</div>
  <div class="header-text">
    <h1>Job Extractor</h1>
    <p>Pull jobs from the current LinkedIn page</p>
  </div>
</div>

<div id="mainContent">
  <!-- injected by popup.js -->
</div>

<script type="module src="popup.js"></script>
</body>
</html>
