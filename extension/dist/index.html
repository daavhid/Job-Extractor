<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApplyFlow Job Extractor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 370px;
      min-height: 180px;
      background: #08080f;
      color: #f1f0fb;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── ApplyFlow Brand Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: linear-gradient(180deg, #121124 0%, #0a0a14 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 25px;
      height: 25px;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(79, 70, 229, 0.5);
    }
    .logo svg {
      width: 14px;
      height: 14px;
    }
    .header-text h1 {
      font-size: 12.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 4px;
      line-height: 1.2;
    }
    .header-text h1 span {
      background: linear-gradient(135deg, #818cf8 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    .header-text p {
      font-size: 9.5px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .platform-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 9.5px;
      font-weight: 600;
      padding: 2.5px 7px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
    }
    .platform-chip .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #64748b;
    }
    .platform-chip.supported {
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.08);
      color: #34d399;
    }
    .platform-chip.supported .dot {
      background: #10b981;
      box-shadow: 0 0 5px rgba(16, 185, 129, 0.7);
    }

    /* ── Controls Toolbar ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 10px;
      background: #08080f;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 5px 9px;
      height: 28px;
      border: none;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #extractBtn {
      flex: 1.3;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.35);
    }
    #extractBtn:hover:not(:disabled) {
      filter: brightness(1.1);
      box-shadow: 0 3px 12px rgba(79, 70, 229, 0.5);
      transform: translateY(-1px);
    }
    #copyBtn {
      flex: 1;
      background: #131320;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #copyBtn:hover:not(:disabled) {
      background: #1a1a2e;
      color: #ffffff;
      border-color: rgba(99, 102, 241, 0.3);
    }
    #exportBtn {
      background: rgba(16, 185, 129, 0.08);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 5px 8px;
    }
    #exportBtn:hover:not(:disabled) {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
    }
    #clearBtn {
      flex: 0 0 24px;
      height: 28px;
      width: 24px;
      padding: 0;
      background: transparent;
      color: #64748b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      font-size: 11px;
    }
    #clearBtn:hover:not(:disabled) {
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.3);
      background: rgba(248, 113, 113, 0.08);
    }

    /* ── Status Bar ── */
    .status {
      padding: 3px 10px;
      font-size: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 20px;
    }
    .status.info    { color: #94a3b8; }
    .status.success { color: #34d399; font-weight: 500; }
    .status.error   { color: #f87171; }

    /* ── Warning Banner ── */
    .warning-banner {
      background: rgba(239, 68, 68, 0.07);
      color: #fca5a5;
      border-bottom: 1px solid rgba(239, 68, 68, 0.18);
      padding: 5px 10px;
      font-size: 10px;
      line-height: 1.35;
    }

    /* ── Results Container ── */
    #results {
      max-height: 380px;
      overflow-y: auto;
      padding: 2px 10px 10px;
    }
    #results::-webkit-scrollbar { width: 4px; }
    #results::-webkit-scrollbar-thumb { background: #222235; border-radius: 4px; }

    /* ── Job Card ── */
    .job-card {
      background: #0f0f1c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 5px;
      position: relative;
      transition: border-color 0.15s ease;
    }
    .job-card:hover { border-color: rgba(99, 102, 241, 0.35); }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
    }
    .job-title {
      font-size: 12px;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.3;
      word-break: break-word;
    }
    .job-number {
      font-size: 8.5px;
      font-weight: 700;
      color: #818cf8;
      background: rgba(99, 102, 241, 0.15);
      padding: 1px 4px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .job-company {
      font-size: 11px;
      color: #818cf8;
      font-weight: 600;
      margin-bottom: 6px;
    }

    /* ── Badges / Meta Chips ── */
    .meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }
    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 9.5px;
      font-weight: 600;
      padding: 1.5px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .chip-salary {
      background: rgba(16, 185, 129, 0.08);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.2);
    }
    .chip-location {
      background: rgba(59, 130, 246, 0.08);
      color: #60a5fa;
      border-color: rgba(59, 130, 246, 0.2);
    }
    .chip-model {
      background: rgba(168, 85, 247, 0.08);
      color: #c084fc;
      border-color: rgba(168, 85, 247, 0.2);
    }

    /* ── Links ── */
    .link-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 10px;
    }
    .link-item {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .link-item strong {
      color: #94a3b8;
      font-weight: 500;
      flex-shrink: 0;
    }
    .link-item a {
      color: #38bdf8;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .link-item.apply-link a {
      color: #34d399;
      font-weight: 500;
    }
    .link-item a:hover {
      text-decoration: underline;
    }

    /* ── Description Accordion ── */
    .desc-toggle {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-top: 6px;
      font-size: 10px;
      color: #94a3b8;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s ease;
    }
    .desc-toggle:hover { color: #cbd5e1; }
    .desc-toggle.no-desc { cursor: default; color: #475569; }

    .job-description {
      display: none;
      margin-top: 5px;
      font-size: 10px;
      color: #cbd5e1;
      line-height: 1.45;
      max-height: 120px;
      overflow-y: auto;
      background: #07070d;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 6px 8px;
      white-space: pre-line;
    }
    .job-description.open { display: block; }
    .job-description::-webkit-scrollbar { width: 3px; }
    .job-description::-webkit-scrollbar-thumb { background: #222235; border-radius: 3px; }

    .job-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 9px;
      color: #64748b;
    }

    /* ── Empty State ── */
    .empty-state {
      padding: 24px 16px;
      text-align: center;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      margin-top: 6px;
      background: rgba(255, 255, 255, 0.015);
    }
    .empty-icon {
      font-size: 20px;
      margin-bottom: 6px;
      opacity: 0.8;
    }
    .empty-title {
      font-size: 12px;
      font-weight: 700;
      color: #f1f0fb;
      margin-bottom: 4px;
    }
    .empty-subtitle {
      font-size: 10px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .empty-subtitle strong {
      color: #818cf8;
    }
  </style>
  <script type="module" crossorigin src="./assets/mainWorldHelper-C5gwek9s.js"></script>
  <script type="module" crossorigin src="./assets/popup-CDKQ8Quw.js"></script>
</head>

<body>
  <div class="header">
    <div class="brand-wrap">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
      </div>
      <div class="header-text">
        <h1>ApplyFlow <span>Job Extractor</span></h1>
        <p>Precision Capture & Auto-Fill</p>
      </div>
    </div>
    <div id="platformHeaderBadge" class="platform-chip">
      <span class="dot"></span>
      <span id="platformHeaderName">Checking...</span>
    </div>
  </div>

  <div id="mainContent"></div>

  <!-- CRXJS resolves src/popup.ts at build time -->
</body>

</html>
