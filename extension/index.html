<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 400px;
      min-height: 200px;
      background: #0a0a0f;
      color: #e8e6f0;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 16px 14px;
      border-bottom: 1px solid #1e1e2e;
      background: linear-gradient(135deg, #0d0d1c 0%, #0a0a0f 100%);
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
    }
    .header-text h1 { font-size: 15px; font-weight: 700; color: #f0eeff; letter-spacing: 0.3px; }
    .header-text p  { font-size: 11px; color: #7c7b96; margin-top: 2px; }

    .platform-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #11111f;
      border-bottom: 1px solid #1e1e2e;
    }
    .platform-label {
      font-size: 11px;
      font-weight: 600;
      color: #7c7b96;
    }
    .platform-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-supported {
      background: #10b981;
      color: #ecfdf5;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.25);
    }
    .badge-generic {
      background: #3b3b4f;
      color: #d1d5db;
    }

    .warning-banner {
      background: #2d1a1a;
      color: #f87171;
      border-bottom: 1px solid #4a2828;
      padding: 10px 16px;
      font-size: 11px;
      line-height: 1.4;
    }

    .controls {
      display: flex;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid #1e1e2e;
    }
    button {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #extractBtn {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
    }
    #extractBtn:hover:not(:disabled) {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      box-shadow: 0 0 14px rgba(99, 102, 241, 0.35);
    }
    #copyBtn { background: #1e1e2e; color: #a8a5c0; border: 1px solid #2e2e42; }
    #copyBtn:hover:not(:disabled) { background: #252538; color: #e0ddf5; }
    #exportBtn { background: #14281a; color: #4ade80; border: 1px solid #223f2d; }
    #exportBtn:hover:not(:disabled) { background: #1b3523; }
    #clearBtn { background: #1e1e2e; color: #7c7b96; border: 1px solid #2e2e42; flex: 0 0 32px; font-size: 14px; }
    #clearBtn:hover:not(:disabled) { background: #252538; color: #f87171; border-color: #4a2828; }
    #analyzeBtn { background: #d97706; color: #ffffff; margin-top: 10px; width: calc(100% - 32px); margin-left: 16px; margin-right: 16px; box-shadow: 0 0 10px rgba(217, 119, 6, 0.2); }
    #analyzeBtn:hover:not(:disabled) { background: #b45309; box-shadow: 0 0 14px rgba(217, 119, 6, 0.35); }

    .status {
      padding: 8px 16px;
      font-size: 11px;
      min-height: 24px;
    }
    .status.success { color: #4ade80; }
    .status.error   { color: #f87171; }
    .status.info    { color: #60a5fa; }

    #results {
      max-height: 420px;
      overflow-y: auto;
      padding: 0 16px 16px;
    }
    #results::-webkit-scrollbar { width: 4px; }
    #results::-webkit-scrollbar-thumb { background: #2e2e42; border-radius: 4px; }

    .job-card {
      background: #111120;
      border: 1px solid #1e1e2e;
      border-radius: 8px;
      padding: 14px;
      margin-top: 12px;
      position: relative;
      transition: border-color 0.2s;
    }
    .job-card:hover { border-color: #2e2e4c; }

    .job-number { position: absolute; top: 10px; right: 10px; font-size: 10px; color: #484869; font-weight: 700; }
    .job-title  { font-size: 14px; font-weight: 700; color: #c5c2e8; margin-bottom: 4px; padding-right: 24px; line-height: 1.4; }
    .job-company { font-size: 12px; color: #818cf8; font-weight: 600; margin-bottom: 8px; }

    .job-metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin-bottom: 8px;
      font-size: 11px;
      border-bottom: 1px dashed #1e1e2e;
      padding-bottom: 6px;
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #a8a5c0;
    }
    .meta-item span {
      color: #6b6980;
    }
    .model-tag {
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .model-remote {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .model-hybrid {
      background: rgba(99, 102, 241, 0.12);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .model-onsite {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .job-link a { font-size: 11px; color: #60a5fa; text-decoration: none; word-break: break-all; }
    .job-link a:hover { color: #93c5fd; text-decoration: underline; }

    .job-apply-url { margin-top: 4px; }
    .job-apply-url a { font-size: 11px; color: #34d399; text-decoration: none; word-break: break-all; }
    .job-apply-url a:hover { color: #6ee7b7; text-decoration: underline; }

    .job-source { font-size: 10px; color: #6b6980; margin-top: 8px; border-top: 1px solid #191928; padding-top: 6px; }

    .desc-toggle { display: inline-block; margin-top: 10px; font-size: 11px; color: #7c7b96; cursor: pointer; user-select: none; font-weight: 500; }
    .desc-toggle:hover { color: #a8a5c0; }
    .desc-toggle.no-desc { cursor: default; color: #2e2e42; }
    .desc-toggle.no-desc:hover { color: #2e2e42; }

    .job-description {
      display: none;
      margin-top: 8px;
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.6;
      max-height: 160px;
      overflow-y: auto;
      background: #08080d;
      border: 1px solid #141420;
      border-radius: 4px;
      padding: 10px;
    }
    .job-description.open { display: block; }

    .analysis-container {
      padding: 0 16px 16px;
    }
    .analysis-card {
      background: #1e1b4b;
      border: 1px solid #312e81;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }
    .analysis-card h3 { font-size: 12px; font-weight: 700; color: #c084fc; margin-bottom: 6px; }
    .analysis-card pre { font-family: monospace; font-size: 10px; color: #e9d5ff; white-space: pre-wrap; overflow-x: auto; }
  </style>
</head>

<body>
  <div class="header">
    <div class="logo">💼</div>
    <div class="header-text">
      <h1>Job Analyzer</h1>
      <p>Extract job details from any supported page</p>
    </div>
  </div>

  <div id="mainContent"></div>

  <!-- CRXJS resolves src/popup.ts at build time -->
  <script type="module" src="src/popup.ts"></script>
</body>

</html>
